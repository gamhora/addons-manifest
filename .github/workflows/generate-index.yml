name: Generate Consolidated Addons Catalog

on:
  push:
    branches:
      - main
    paths:
      - 'addons/**'
  workflow_dispatch:

jobs:
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install js-yaml

      - name: Parse YAMLs and Generate root index.json
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const yaml = require("js-yaml");

          const addonsDir = "addons";
          if (!fs.existsSync(addonsDir)) {
            console.log("Pasta addons/ não encontrada, criando...");
            fs.mkdirSync(addonsDir, { recursive: true });
          }

          const files = fs.readdirSync(addonsDir).filter(f => f.endsWith(".yaml") || f.endsWith(".yml"));
          const catalog = [];

          for (const file of files) {
            const filePath = path.join(addonsDir, file);
            try {
              const content = fs.readFileSync(filePath, "utf8");
              const doc = yaml.load(content);

              const id = doc.id || doc.AddonId;
              if (!doc || !id) {
                console.warn(`[AVISO] Ignorando arquivo sem ID válido: ${filePath}`);
                continue;
              }

              catalog.push(doc);
              console.log(`✓ Processado: ${id} (${file})`);
            } catch (err) {
              console.error(`[ERRO] Falha ao processar ${filePath}:`, err.message);
            }
          }

          // Salva o catálogo consolidado direto na raiz (index.json)
          fs.writeFileSync("index.json", JSON.stringify(catalog, null, 2), "utf8");
          console.log(`\n🎉 Catálogo consolidado gerado com sucesso em ./index.json com ${catalog.length} addons.`);
          '

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          
          git add index.json
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(catalog): update index.json [skip ci]"
            git push origin main
          else
            echo "Nenhuma alteração no catálogo para comitar."
          fi